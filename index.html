<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>연안송씨 대종회 Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Noto Serif KR',serif;
    background:#f5f1e8;
    color:#222;
    overflow-x:hidden;
}

/* ===== HEADER ===== */
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:26px 42px;
    background:#f6f2e9;
}

.brand{display:flex;gap:16px;align-items:center}
.seal{width:220px;height:auto}

.right{text-align:right}
.links{font-size:14px;color:#555;margin-bottom:10px}

.search{
    display:flex;
    border:1px solid #7d735f;
}
.search input{
    padding:12px 14px;
    width:260px;
    border:none;
}
.search button{
    width:56px;
    border:none;
    background:#0c4850;
    color:#fff;
    font-size:18px;
}

/* ===== NAV ===== */
nav{
    background:#083d45;
    border-top:1px solid #b89244;
    border-bottom:4px solid #b89244;
    position:sticky;
    top:0;
    z-index:50;
}

.menu{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    max-width:1700px;
    margin:auto;
}

.item{position:relative}

.item > a{
    display:block;
    padding:18px 10px;
    text-align:center;
    color:#e5c67a;
    font-size:18px;
    font-weight:600;
    text-decoration:none;
}

.item > a:hover{
    background:rgba(255,255,255,.08);
}

/* dropdown */
.dropdown{
    display:none;
    position:absolute;
    top:100%;
    left:0;
    min-width:220px;
    background:#f8f3ea;
    border:1px solid #c9ad73;
}

.dropdown a{
    display:block;
    padding:12px;
    color:#333;
    border-bottom:1px solid #e7dcc5;
    text-decoration:none;
}

.dropdown a:hover{
    background:#fff7e7;
}

/* hover dropdown */
.item:hover .dropdown{
    display:block;
}

/* ===== CONTENT AREA (IMPORTANT) ===== */
.content-area{
    width:100%;
    height:calc(100vh - 160px);
}

#boardFrame{
    width:100%;
    height:100%;
    border:none;
    background:#fff;
}

/* ===== FOOTER ===== */
footer{
    background:#083d45;
    color:#ddd;
    padding:22px 40px;
    display:flex;
    justify-content:space-between;
    font-size:14px;
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="top">

    <div class="brand">
        <img src="logos.png" class="seal" alt="연안송씨 대종회 로고">
    </div>

    <div class="right">
        <div class="links">로그인 ｜ 회원가입 ｜ 사이트맵</div>
        <div class="search">
            <input placeholder="검색어를 입력하세요">
            <button>🔍</button>
        </div>
    </div>

</header>

<!-- ================= MENU ================= -->
<nav>
    <div class="menu">

        <div class="item">
            <a href="#">대종회 소개</a>
            <div class="dropdown">
                <a href="#">인사말</a>
                <a href="#">연혁</a>
                <a href="#">조직도</a>
            </div>
        </div>

        <div class="item">
            <a href="#">뿌리탐구</a>
            <div class="dropdown">
                <a href="#">시조 소개</a>
                <a href="#">문중 유래</a>
            </div>
        </div>

        <div class="item">
            <a href="#">인터넷족보</a>
            <div class="dropdown">
                <!-- 🔥 핵심: iframe target -->
                <a href="https://yeonansong.dothome.co.kr/bbs/board.php?bo_table=free"
                   target="boardFrame">
                    자유게시판
                </a>

                <a href="https://yeonansong.dothome.co.kr/bbs/board.php?bo_table=notice"
                   target="boardFrame">
                    공지사항
                </a>

                <a href="https://yeonansong.dothome.co.kr/bbs/board.php?bo_table=genealogy"
                   target="boardFrame">
                    족보열람
                </a>
            </div>
        </div>

        <div class="item">
            <a href="#">자료실</a>
            <div class="dropdown">
                <a href="#" target="boardFrame">문서자료</a>
                <a href="#" target="boardFrame">사진자료</a>
            </div>
        </div>

    </div>
</nav>

<!-- ================= CONTENT (iframe 핵심) ================= -->
<section class="content-area">

    <iframe id="boardFrame"
        name="boardFrame"
        src="https://yeonansong.dothome.co.kr/bbs/board.php?bo_table=notice">
    </iframe>

</section>

<!-- ================= FOOTER ================= -->
<footer>
    <div>연안송씨 대종회 ｜ 서울특별시</div>
    <div>개인정보처리방침 ｜ 이용약관</div>
</footer>

</body>
</html>
